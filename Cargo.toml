[package]
keywords = ["libhydrogen", "cryptography", "encryption", "signatures", "key-exchange"]
name = "libhydrogen"
version = "0.4.6"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Rust bindings to libhydrogen for authenticated encryption, signatures, hashing, key derivation, and key exchange"
